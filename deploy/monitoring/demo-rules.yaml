# Fast-firing demo alerts. The built-in KubePodCrashLooping waits 15 minutes, which is too slow for a demo.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-fast-alerts
  namespace: monitoring
spec:
  groups:
    - name: demo
      rules:
        - alert: DemoPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="demo"}[3m]) >= 2
          for: 30s
          labels: {severity: warning}
          annotations:
            summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping
            description: Container {{ $labels.container }} restarted {{ $value | printf "%.0f" }} times in 3 minutes.
        - alert: DemoImagePullFailing
          expr: max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{namespace="demo", reason=~"ErrImagePull|ImagePullBackOff"}) > 0
          for: 1m
          labels: {severity: warning}
          annotations:
            summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} cannot pull its image
            description: Container {{ $labels.container }} is stuck in image pull back-off.
        - alert: DemoPodOOMKilled
          expr: max by (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{namespace="demo", reason="OOMKilled"}) > 0
          for: 30s
          labels: {severity: warning}
          annotations:
            summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled
            description: Container {{ $labels.container }} exceeded its memory limit.
