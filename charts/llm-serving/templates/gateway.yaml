{{- $g := .Values.gateway }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  labels:
    app.kubernetes.io/name: llm-gateway
    {{- include "llm.labels" . | nindent 4 }}
spec:
  replicas: {{ $g.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: gateway
          image: "{{ $g.image.repository }}:{{ $g.image.tag }}"
          imagePullPolicy: {{ $g.image.pullPolicy }}
          env:
            - name: OLLAMA_URL
              value: "http://ollama.{{ .Release.Namespace }}.svc.cluster.local:11434"
            - name: MODEL
              value: {{ .Values.ollama.model | quote }}
            - name: MAX_CONCURRENCY
              value: {{ $g.maxConcurrency | quote }}
            - name: QUEUE_TIMEOUT_SECONDS
              value: {{ $g.queueTimeoutSeconds | quote }}
            - name: REQUEST_TIMEOUT_SECONDS
              value: {{ $g.requestTimeoutSeconds | quote }}
            - name: DEFAULT_MAX_TOKENS
              value: {{ $g.defaultMaxTokens | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml $g.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  labels:
    app.kubernetes.io/name: llm-gateway
    {{- include "llm.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: llm-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
